<!DOCTYPE html>
<html lang="fr">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Inscription | Créez votre compte recettes</title>
  <meta name="description"
    content="Connectez-vous à votre compte pour ajouter des recettes, commenter et sauvegarder vos plats préférés.">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/7.0.1/css/all.min.css"
    integrity="sha512-2SwdPD6INVrV/lHTZbO2nodKhrnDdJK9/kg2XD1r9uGqPo1cUbujc+IYdlYdEErWNu69gVcYgdxlmVmzTWnetw=="
    crossorigin="anonymous" referrerpolicy="no-referrer">
  <link rel="canonical" href="https://CuisineCollab.com/pages_html/signUp.html">
  <link rel="icon" type="image/x-icon" href="../favicon.ico">
  <link rel="stylesheet" href="../styles/index.css">
</head>

<body>
  <nav>
    <div class="hamburger">
      <span></span>
      <span></span>
      <span></span>
    </div>
    <ul class="nav-left">
      <li><a href="../index.html">Home</a></li>
      <li><a href="./recipe.html">Recette</a></li>
      <li><a href="./search.html">Recherche</a></li>
      <li><a href="./contact.html">Contact</a></li>
    </ul>
    <ul class="nav-right">
      <li>
        <a href="#"><i class="fas fa-magnifying-glass"></i></a>
      </li>
      <li>
        <button id="btn-dyslexie" aria-label="Activer la police pour dyslexiques">Aa</button>
      </li>
      <li><a href="./signIn.html" class="btn">Se connecter</a></li>
      <li><a href="./signUp.html" class="btn">S'inscrire</a></li>
    </ul>
  </nav>
  <section class="signUp">
    <div class="inscription">
      <h1>Créer mon compte</h1>
      <ul>
        <li>
          <a href="https://facebook.com" target="_blank" aria-label="Facebook"><i class="fab fa-facebook-f"></i></a>
        </li>
        <li>
          <a href="https://www.google.fr" target="_blank" aria-label="Google +"><i
              class="fa-brands fa-google-plus-g"></i></a>
        </li>
        <li>
          <a href="https://linkedin.com" target="_blank" aria-label="LinkedIn"><i
              class="fa-brands fa-linkedin-in"></i></a>
        </li>
      </ul>
      <p>Ou utilisez votre compte email :</p>
      <form id="formulaire-inscription">
        <label for="pseudo">Pseudo du Chef</label>
        <input type="text" id="pseudo" placeholder="Chef Mélanie" required>
        <label for="email">Email</label>
        <input type="email" id="email" placeholder="chef@exemple.com" required>
        <label for="mdp">Mot de passe</label>
        <input type="password" id="mdp" placeholder="********" required>
        <p>En vous inscrivant, vous acceptez nos conditions générales.</p>
        <div class="submit-container">
          <input type="submit" class="btn" value="S'inscrire">
        </div>
      </form>
    </div>
    <div class="imgSignUp">
      <h1>Prêt à cuisiner ?</h1>
      <p>Vous avez déjà un compte ?<br>Connectez-vous pour retrouver vos recettes</p>
      <a href="./signIn.html" class="btn">Se connecter</a>
    </div>
  </section>
  <script src="../Javascript/index.js"></script>
</body>

</html>
